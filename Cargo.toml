[package]
name = "race-replay"
version = "0.1.0"
edition = "2021"
description = "Replay of a race on a map: patrols of all categories moving minute by minute"
publish = false

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlElement", "HtmlInputElement", "KeyboardEvent", "Element", "EventTarget", "Document", "Window"] }
gloo-net = { version = "0.7", default-features = false, features = ["http"] }
gloo-events = "0.3"
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
roxmltree = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[dev-dependencies]
yew = { version = "0.23", features = ["csr", "ssr"] }
tokio = { version = "1", features = ["rt", "macros"] }
